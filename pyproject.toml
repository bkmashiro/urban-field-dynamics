[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urban-field-dynamics"
version = "0.1.0"
description = "Seeded urban evolution simulation engine for robust policy experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yuzhe", email = "53376445+bkmashiro@users.noreply.github.com" }]
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
]

[project.scripts]
urban-field = "urban_field_dynamics.cli:main"

[project.optional-dependencies]
analysis = [
  "duckdb>=1.4,<2",
  "matplotlib>=3.9,<4",
  "polars>=1.0,<2",
]
accelerate = ["numba>=0.61,<1"]
gpu = ["jax>=0.5,<1"]
transport = ["aequilibrae>=1.4,<2"]
dev = [
  "hypothesis>=6.0,<7",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "hypothesis>=6.0,<7",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urban_field_dynamics"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
